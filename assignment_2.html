<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Operators
    </title>
</head>
<body>
    <script>
        // Task 1: Declare variables
        let num1;
        let num2;

        // Task 2: Assign values
        num1 = 56;
        num2 = 23;

        // Task 3: Perform arithmetic operations
        console.log("Sum: " + (num1 + num2)); 
        console.log("Difference: " + (num1 - num2)); 
        console.log("Product: " + (num1 * num2)); 
        console.log("Quotient: " + (num1 / num2)); 

        // Task 4: Explore assignment operators and update the values of variables
        num1 += 3;
        num2 -= 2;
        console.log("Updated num1: ", num1);
        console.log("Updated num2: ", num2);

        // Task 5: Explore comparison operators
        console.log("Is num1 equal to num2?", num1 == num2);
        console.log("Is num1 greater than num2?", num1 > num2);
        console.log("Is num1 not equal to num2?", num1 != num2);
        
        // Task 6: Explore logical operators
        let isPositive = num1 > 0 && num2 > 0;
        let isEven = num1 % 2 == 0 || num2 % 2 == 0;
        console.log("Are both numbers positive?", isPositive);
        console.log("Is at least one number even?", isEven);
    </script>
</body>
</html>
