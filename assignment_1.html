<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Data Types</title>
</head>
<body>
    <script>
        // Task 1: Declare variables
        let studentName;
        let studentAge;
        let studentGrade;
        let isPresent;

        // Task 2: Assign values
        studentName = "John";
        studentAge = 13;
        studentGrade = 8;
        isPresent = false;

        // Task 3: Display values
        console.log(studentName); // Outputs: "John"
        console.log(studentAge);  // Outputs: 13
        console.log(studentGrade); // Outputs: 8
        console.log(isPresent);   // Outputs: false
    </script>
</body>
</html>
